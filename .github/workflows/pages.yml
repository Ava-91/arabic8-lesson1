name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Checking $PAGE_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-connrefused "$PAGE_URL" >/tmp/page.html
          grep -q 'عربی ۸' /tmp/page.html
          grep -q 'css/styles.css?v=21' /tmp/page.html
          grep -q 'js/app.js?v=21' /tmp/page.html
          echo "GitHub Pages deployment is reachable and serving the expected build."
